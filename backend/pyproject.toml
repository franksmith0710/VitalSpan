[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitalspan-backend"
version = "0.1.0"
description = "VitalSpan BI platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "apscheduler>=3.10.0",
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
    "elasticsearch>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]
connectors-ext = [
    "pyhive>=0.7.0",
    "pymssql>=2.3.0",
    "oracledb>=2.5.0",
    "clickhouse-connect>=0.7.0",
    "dmPython>=2.5.0",
    "trino>=0.330.0",
    "pymongo>=4.6.0",
    "influxdb-client>=1.40.0",
    "taospy>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["../tests"]
markers = [
    "integration: requires docker compose sample-mysql and analytics-postgres",
]
