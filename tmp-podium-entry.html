<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:transparent;overflow:hidden}#podium-container{width:100%;height:100%;padding:16px 20px;display:flex;flex-direction:column;overflow:hidden}.podium-area{display:flex;align-items:flex-end;justify-content:center;gap:20px;flex-shrink:0;padding-top:4px}.podium-card{display:flex;flex-direction:column;align-items:center;width:32%;max-width:170px;opacity:0;animation:vsRise .6s ease-out forwards}.podium-medal{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.22);margin-bottom:8px;width:42px;height:42px;font-size:17px}.podium-card.first .podium-medal{width:52px;height:52px;font-size:21px}.podium-name{font-size:14px;font-weight:600;color:var(--dashboard-text-primary,#1e293b);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}.podium-value{font-family:Consolas,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;margin-bottom:8px}.podium-base{width:100%;border-radius:8px 8px 0 0;opacity:.92}.list-area{flex:1;min-height:0;overflow-y:auto;margin-top:12px}.list-row{display:flex;align-items:center;padding:7px 4px;border-bottom:1px dashed rgba(100,116,139,.18);opacity:0;animation:vsFade .45s ease-out forwards}.row-rank{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(100,116,139,.14);color:var(--dashboard-text-muted,#64748b);margin-right:10px;flex-shrink:0}.row-name{flex:1;min-width:0;font-size:13px;color:var(--dashboard-text-primary,#1e293b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-value{font-family:Consolas,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;margin-left:10px;flex-shrink:0}.empty-state{display:flex;align-items:center;justify-content:center;height:100%;min-height:80px;color:#94a3b8;font-size:14px}@keyframes vsRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes vsFade{from{opacity:0}to{opacity:1}}</style></head><body><div id='podium-container'><div id='podium-area' class='podium-area'></div><div id='list-area' class='list-area'></div></div><script>(function(){var host=document.currentScript&&document.currentScript.parentElement;var GOLD='#f59e0b',SILVER='#94a3b8',BRONZE='#d97706';function str(st,k,d){return typeof st[k]==='string'?st[k]:d}function num(st,k,d){var v=Number(st[k]);return isFinite(v)?v:d}function bool(st,k,d){return typeof st[k]==='boolean'?st[k]:d}function medalColor(st,rank){if(rank===1)return str(st,'goldColor',GOLD);if(rank===2)return str(st,'silverColor',SILVER);return str(st,'bronzeColor',BRONZE)}function parseRows(p){if(!p||p.bindingStatus!=='bound'||!p.rows||!p.rows.length)return[];var out=[];for(var i=0;i<p.rows.length;i++){var row=p.rows[i];var v=Number(row[1]);if(!isNaN(v))out.push({name:String(row[0]),value:v})}out.sort(function(a,b){return b.value-a.value});return out}function formatValue(v){if(v>=1e8)return(v/1e8).toFixed(1)+'亿';if(v>=1e4)return(v/1e4).toFixed(1)+'万';if(v>=1e3)return(v/1e3).toFixed(1)+'K';return v.toLocaleString()}function showHint(pa,la,text){pa.innerHTML='';pa.style.display='none';la.innerHTML='';var d=document.createElement('div');d.className='empty-state';d.textContent=text;la.appendChild(d)}function render(p){p=p||{};var st=p.style||{};var pa=document.getElementById('podium-area');var la=document.getElementById('list-area');if(!pa||!la)return;if(p.bindingStatus!=='bound'){showHint(pa,la,'请在右侧绑定数据集与字段');return}var data=parseRows(p);if(!data.length){showHint(pa,la,'暂无数据');return}var showPodium=bool(st,'showPodium',true);var showValues=bool(st,'showValues',true);var maxItems=Math.max(3,Math.min(20,num(st,'maxItems',10)));var anim=num(st,'animationDuration',800);var accent=str(st,'accentColor','#3b82f6');pa.innerHTML='';la.innerHTML='';pa.style.display=showPodium?'':'none';var head=showPodium?data.slice(0,3):[];var rest=data.slice(head.length,maxItems);var order=[1,0,2];var baseH=[88,66,50];var delay=0;for(var k=0;k<order.length;k++){var idx=order[k];if(idx>=head.length)continue;var item=head[idx];var rank=idx+1;var card=document.createElement('div');card.className='podium-card'+(rank===1?' first':'');card.style.animationDuration=(anim/1000)+'s';card.style.animationDelay=delay+'ms';delay+=120;var medal=document.createElement('div');medal.className='podium-medal';medal.style.background=medalColor(st,rank);medal.textContent=String(rank);card.appendChild(medal);var nm=document.createElement('div');nm.className='podium-name';nm.title=item.name;nm.textContent=item.name;card.appendChild(nm);if(showValues){var pv=document.createElement('div');pv.className='podium-value';pv.style.color=medalColor(st,rank);pv.textContent=formatValue(item.value);card.appendChild(pv)}var base=document.createElement('div');base.className='podium-base';base.style.height=baseH[idx]+'px';base.style.background=medalColor(st,rank);card.appendChild(base);pa.appendChild(card)}for(var i=0;i<rest.length;i++){var item2=rest[i];var rank2=head.length+i+1;var row=document.createElement('div');row.className='list-row';row.style.animationDuration=(anim/1600)+'s';row.style.animationDelay=(delay+i*45)+'ms';var rk=document.createElement('span');rk.className='row-rank';rk.textContent=String(rank2);row.appendChild(rk);var nm2=document.createElement('span');nm2.className='row-name';nm2.title=item2.name;nm2.textContent=item2.name;row.appendChild(nm2);if(showValues){var vv=document.createElement('span');vv.className='row-value';vv.style.color=accent;vv.textContent=formatValue(item2.value);row.appendChild(vv)}la.appendChild(row)}}if(host&&host.vsCv&&host.vsCv.mount){host.vsCv.mount(render)}else{render({})}})();</script></body></html>
