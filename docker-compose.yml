services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vitalspan
      POSTGRES_PASSWORD: vitalspan
      POSTGRES_DB: vitalspan
    volumes:
      - vitalspan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalspan"]
      interval: 5s
      timeout: 5s
      retries: 5

  analytics-postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vitalspan
      POSTGRES_PASSWORD: vitalspan
      POSTGRES_DB: analytics
    volumes:
      - vitalspan_analytics_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalspan -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  sample-mysql:
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sample_db
      MYSQL_USER: sample
      MYSQL_PASSWORD: sample
    volumes:
      - ./docker/sample-mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usample", "-psample"]
      interval: 5s
      timeout: 5s
      retries: 10

  sample-mariadb:
    image: mariadb:11
    ports:
      - "3308:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: sample_db
      MARIADB_USER: sample
      MARIADB_PASSWORD: sample
    volumes:
      - ./docker/sample-mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  sample-clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8124:8123"
    volumes:
      - ./docker/sample-clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vitalspan_pg_data:
  vitalspan_analytics_pg_data:
